[tasks.setup]
description = "Run all setup tasks (dotfiles, nvim, ghostty, orca, deno, tools, bin)"
depends = ["install:dotfiles", "install:nvim", "install:ghostty", "install:orca", "install:deno", "install:tools", "install:bin"]

[tasks."install:dotfiles"]
description = "Create symlinks for dotfiles to home directory"
run = '''
#!/bin/bash
set -e

IGNORE_FILES=".git README.md mise.toml bin nvim ghostty orca"
BASE_PATH="{{config_root}}"

for file in "$BASE_PATH"/{.*,*}; do
  filename=$(basename "$file")

  # Skip ignored files
  [[ " $IGNORE_FILES " =~ " $filename " ]] && continue
  [[ "$filename" == "." || "$filename" == ".." ]] && continue

  dest="$HOME/$filename"
  ln -sfn "$file" "$dest"
  echo "Linked: $filename -> $dest"
done
'''

[tasks."install:tools"]
description = "Install CLI tools from banyan's repos (git modified_files, gh contrib)"
run = '''
#!/bin/bash
set -e

if ! command -v cargo >/dev/null; then
  echo "cargo not found. Install Rust first: https://rustup.rs" >&2
  exit 1
fi

# .gitconfig rewrites https://github.com/ to SSH, which cargo's built-in git
# client can't authenticate; the git CLI can.
CARGO_NET_GIT_FETCH_WITH_CLI=true cargo install --git https://github.com/banyan/git_modified_files

if gh extension list | grep -q 'banyan/gh-contrib'; then
  gh extension upgrade contrib
else
  gh extension install banyan/gh-contrib
fi
'''

[tasks."install:deno"]
description = "Install deno via mise (bin/aicommit and bin/claude-quota still run on it)"
run = "mise install deno"

[tasks."install:orca"]
description = "Symlink Orca keybindings into ~/.orca"
run = '''
#!/bin/bash
set -e
mkdir -p "$HOME/.orca"
ln -sfn "{{config_root}}/orca/keybindings.json" "$HOME/.orca/keybindings.json"
'''

[tasks."install:ghostty"]
description = "Create ~/.config/ghostty symlink"
run = '''
#!/bin/bash
set -e
mkdir -p "$HOME/.config"
ln -sfn "{{config_root}}/ghostty" "$HOME/.config/ghostty"
echo "Linked: ghostty -> $HOME/.config/ghostty"
'''

[tasks."install:nvim"]
description = "Install neovim via mise and create ~/.config/nvim symlink"
run = '''
#!/bin/bash
set -e
mise install neovim
mkdir -p "$HOME/.config"
ln -sfn "{{config_root}}/nvim" "$HOME/.config/nvim"
echo "Linked: nvim -> $HOME/.config/nvim"
'''

[tasks."install:bin"]
description = "Create symlinks for bin commands to ~/bin"
run = '''
#!/bin/bash
set -e

BIN_COMMANDS="aicommit claude-quota codex-quota"
BASE_PATH="{{config_root}}/bin"

mkdir -p "$HOME/bin"

for cmd in $BIN_COMMANDS; do
  src="$BASE_PATH/$cmd"
  dest="$HOME/bin/$cmd"
  if [[ -f "$src" ]]; then
    ln -sfn "$src" "$dest"
    echo "Linked: $cmd -> $dest"
  else
    echo "Warning: $src not found, skipping"
  fi
done
'''

[tasks.cleanup]
description = "Remove symlinks in home that point to this repo but whose targets no longer exist"
run = '''
#!/bin/bash
set -e

BASE_PATH="{{config_root}}"
removed=0

for link in "$HOME"/{.*,*}; do
  [[ -L "$link" ]] || continue
  target=$(readlink "$link")
  [[ "$target" == "$BASE_PATH"* ]] || continue

  if [[ ! -e "$link" ]]; then
    echo "Removing orphaned symlink: $(basename "$link") -> $target"
    rm "$link"
    ((removed++))
  fi
done

echo "Done. Removed $removed orphaned symlink(s)."
'''

